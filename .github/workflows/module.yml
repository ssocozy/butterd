name: Module
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: module-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;28.2.13676358 platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Validate structure and test configuration
        run: |
          python3 tools/validate.py
          node --check module/webroot/app.js
          mkdir -p build
          g++ -std=c++20 -Wall -Wextra -Werror -Inative/compatibility native/compatibility/pif_config.cpp tests/config_test.cpp -o build/config-test
          build/config-test
      - name: Cross-compile compatibility component
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-34 -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Compile installation metadata helper
        run: |
          mkdir -p build/java build/dex
          javac -source 8 -target 8 -bootclasspath "$ANDROID_HOME/platforms/android-36/android.jar" -d build/java java/dev/butterd/module/*.java java/dev/butterd/butter/*.java
          javac -source 8 -target 8 -cp "build/java:$ANDROID_HOME/platforms/android-36/android.jar" -d build/java tests/EngineTest.java
          java -cp "build/java:$ANDROID_HOME/platforms/android-36/android.jar" dev.butterd.butter.EngineTest
          mapfile -d '' classes < <(find build/java/dev -name '*.class' ! -name 'EngineTest.class' -print0)
          "$ANDROID_HOME/build-tools/36.0.0/d8" --lib "$ANDROID_HOME/platforms/android-36/android.jar" --min-api 34 --output build/dex "${classes[@]}"
          cp build/dex/classes.dex module/bin/catalog.dex
      - name: Refresh bundled Pixel catalog
        run: python3 tools/fetch_catalog.py
      - name: Package module
        run: |
          python3 tools/package.py
          unzip -t dist/butterd-module.zip
      - name: Publish module ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "module-debug-${GITHUB_RUN_NUMBER}" dist/butterd-module.zip --prerelease --target "$GITHUB_SHA" --title "Butterd module #${GITHUB_RUN_NUMBER}" --notes "Duchamp development module. Build and source checks passed; hardware validation is pending."
      - uses: actions/upload-artifact@v4
        with:
          name: butterd-module
          path: dist/butterd-module.zip
          if-no-files-found: error
