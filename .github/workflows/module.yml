name: Module
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options:
          - development
          - production
        default: development
permissions:
  contents: read
concurrency:
  group: module-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      RELEASE_CHANNEL: ${{ inputs.channel || 'development' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version=//p' module/module.prop)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "MODULE_VERSION=$version" >> "$GITHUB_ENV"
          if [ "$RELEASE_CHANNEL" = production ]; then
            if gh release view "v$version" >/dev/null 2>&1; then
              echo "Release v$version already exists. Increment the module version."
              exit 1
            fi
          fi
      - name: Locate dependency caches
        id: cache-paths
        run: |
          echo "sdk=$ANDROID_HOME" >> "$GITHUB_OUTPUT"
          echo "cargo=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_OUTPUT"
          echo "rustup=${RUSTUP_HOME:-$HOME/.rustup}" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-linux}" >> "$GITHUB_OUTPUT"
      - name: Prepare SDK cache ownership
        run: |
          for package in ndk/28.2.13676358 platforms/android-36 build-tools/36.0.0 cmdline-tools/16.0; do
            if [ -e "$ANDROID_HOME/$package" ]; then
              sudo chown -R "$(id -u):$(id -g)" "$ANDROID_HOME/$package"
            fi
          done
      - name: Cache Android SDK packages
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.cache-paths.outputs.sdk }}/ndk/28.2.13676358
            ${{ steps.cache-paths.outputs.sdk }}/platforms/android-36
            ${{ steps.cache-paths.outputs.sdk }}/build-tools/36.0.0
            ${{ steps.cache-paths.outputs.sdk }}/cmdline-tools/16.0
          key: android-v1-${{ runner.os }}-${{ runner.arch }}-cmdline12266719-ndk28.2.13676358-api36-tools36.0.0
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'ndk;28.2.13676358 platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Cache Rust toolchain
        uses: actions/cache@v5
        with:
          path: ${{ steps.cache-paths.outputs.rustup }}/toolchains/1.90.0-x86_64-unknown-linux-gnu
          key: rust-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-1.90.0-clippy-rustfmt-aarch64-android
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component clippy --component rustfmt --target aarch64-linux-android
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang" >> "$GITHUB_ENV"
      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.cache-paths.outputs.cargo }}/registry/index
            ${{ steps.cache-paths.outputs.cargo }}/registry/cache
            ${{ steps.cache-paths.outputs.cargo }}/registry/src
            ${{ steps.cache-paths.outputs.cargo }}/git/db
            ${{ steps.cache-paths.outputs.cargo }}/git/checkouts
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/butter/Cargo.lock') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache Rust build outputs
        uses: actions/cache@v5
        with:
          path: rust/butter/target
          key: butter-target-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-paths.outputs.image }}-rust1.90.0-ndk28.2.13676358-api34-page16k-${{ hashFiles('rust/butter/Cargo.lock', 'rust/butter/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            butter-target-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-paths.outputs.image }}-rust1.90.0-ndk28.2.13676358-api34-page16k-${{ hashFiles('rust/butter/Cargo.lock', 'rust/butter/Cargo.toml') }}-
            butter-target-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache-paths.outputs.image }}-rust1.90.0-ndk28.2.13676358-api34-page16k-
      - name: Validate module and compatibility configuration
        run: |
          python3 tools/validate.py
          python3 tests/catalog_test.py
          sh tests/compatibility_test.sh
          for script in module/webroot/js/*.js; do node --check "$script"; done
          mkdir -p build
          g++ -std=c++20 -Wall -Wextra -Werror -Inative/compatibility native/compatibility/pif_config.cpp tests/config_test.cpp -o build/config-test
          build/config-test
      - name: Test Rust engine
        run: |
          if [ ! -f rust/butter/Cargo.lock ]; then
            cargo +1.90.0 generate-lockfile --manifest-path rust/butter/Cargo.toml
          fi
          cargo +1.90.0 fmt --manifest-path rust/butter/Cargo.toml
          cargo +1.90.0 test --locked --manifest-path rust/butter/Cargo.toml
          cargo +1.90.0 clippy --locked --manifest-path rust/butter/Cargo.toml --all-targets -- -D warnings
      - name: Smoke test WebUI in Chromium
        run: node tests/webui-smoke.mjs
      - name: Collect dependency sources and licenses
        run: cargo +1.90.0 vendor --locked --manifest-path rust/butter/Cargo.toml build/rust-vendor > build/vendor-config.toml
      - name: Cross-compile Rust engine
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: '-C link-arg=-Wl,-z,max-page-size=16384'
        run: cargo +1.90.0 build --locked --manifest-path rust/butter/Cargo.toml --release --target aarch64-linux-android
      - name: Verify Android file locking backend
        run: |
          "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" --dyn-symbols rust/butter/target/aarch64-linux-android/release/butter > build/butter-symbols.txt
          python3 -c 'import pathlib,re; assert re.search(r"\bflock(?:@|$)", pathlib.Path("build/butter-symbols.txt").read_text(), re.M), "Android binary must link the supported flock backend"'
      - name: Cross-compile compatibility component
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-34 -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded build/libbutterd_compat.so
      - name: Compile Android query helpers
        run: |
          mkdir -p build/java build/dex
          javac -source 8 -target 8 -bootclasspath "$ANDROID_HOME/platforms/android-36/android.jar" -d build/java java/dev/butterd/module/*.java
          "$ANDROID_HOME/build-tools/36.0.0/d8" --release --lib "$ANDROID_HOME/platforms/android-36/android.jar" --min-api 34 --output build/dex build/java/dev/butterd/module/*.class
          cp build/dex/classes.dex module/bin/catalog.dex
      - name: Refresh bundled Pixel catalog
        run: python3 tools/fetch_catalog.py
      - name: Package module
        run: |
          python3 tools/package.py
          unzip -t dist/butterd-module.zip
          unzip -t dist/butterd-sources.zip
          if [ "$RELEASE_CHANNEL" = production ]; then
            mv dist/butterd-module.zip "dist/butterd-$MODULE_VERSION.zip"
            mv dist/butterd-sources.zip "dist/butterd-$MODULE_VERSION-sources.zip"
          fi
          sha256sum dist/*.zip > dist/SHA256SUMS
      - name: Publish module ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RELEASE_CHANNEL" = production ]; then
            gh release create "v$MODULE_VERSION" dist/*.zip dist/SHA256SUMS --target "$GITHUB_SHA" --title "Butterd $MODULE_VERSION" --notes "Release build with the Rust butter engine. Automated tests, Clippy and packaging checks passed. Hardware validation remains pending."
          else
            gh release create "module-debug-${GITHUB_RUN_NUMBER}" dist/*.zip dist/SHA256SUMS --prerelease --target "$GITHUB_SHA" --title "Butterd module #${GITHUB_RUN_NUMBER}" --notes "Development module with the Rust butter engine. Hardware validation remains pending."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: butterd-module
          path: dist/
          if-no-files-found: error
