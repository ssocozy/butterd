name: Android
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests and lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Publish directly downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_tag="debug-${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/app-debug.apk butterd-debug.apk
          gh release create "$release_tag" butterd-debug.apk --prerelease --target "$GITHUB_SHA" --title "Butterd debug #${GITHUB_RUN_NUMBER}" --notes "Development APK from commit ${GITHUB_SHA}. Build, lint and unit tests passed. Install and test on your phone."
      - name: Upload installable development APK
        uses: actions/upload-artifact@v4
        with:
          name: butterd-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
