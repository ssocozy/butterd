name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      device_tests:
        description: Run emulator tests (uses extra Actions minutes)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests and lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Upload installable development APK
        uses: actions/upload-artifact@v4
        with:
          name: butterd-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
  device-tests:
    if: github.event_name == 'workflow_dispatch' && inputs.device_tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        api: [34, 35, 36, 37]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check emulator image availability
        id: image
        run: |
          sdkmanager --list > "$RUNNER_TEMP/sdk-packages.txt"
          if grep -Fq 'system-images;android-${{ matrix.api }};default;x86_64' "$RUNNER_TEMP/sdk-packages.txt"; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          elif [ '${{ matrix.api }}' = '37' ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Android 17 image unavailable; compatibility remains unverified.'
            echo 'Android 17: emulator image unavailable; tests not run.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::error::Required emulator image is unavailable.'
            exit 1
          fi
      - name: Run permission, lifecycle and interface smoke tests
        if: steps.image.outputs.available == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Collect screenshots
        if: always()
        run: adb pull /sdcard/Android/data/dev.butterd/files/screenshots screenshots || true
      - name: Upload device reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-tests-api-${{ matrix.api }}
          path: |
            screenshots/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
