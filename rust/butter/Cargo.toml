[package]
name = "butter"
version = "0.4.23"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-only"
publish = false

[dependencies]
fs2 = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
